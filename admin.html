<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><link rel="stylesheet" href="style.css">
    <style>.w{max-width:900px;margin:20px auto;padding:0 4%}.w input,.w select,.w textarea{padding:8px;margin:3px;border-radius:8px;border:1px solid #6e29a0;background:#18101f;color:#fff}.w button{padding:8px 12px;margin:3px;border-radius:8px;border:0;background:#6e29a0;color:#fff}.c{border:1px solid #3a2550;border-radius:12px;padding:12px;margin:10px 0;font-size:13px}.c b{color:#c384ff}</style></head><body><div class="w">
    <div id="lg"><h2>دخول الأدمن</h2><input id="em" placeholder="الإيميل"><input id="pw" type="password" placeholder="الباسورد"><button onclick="login()">دخول</button></div>
    <div id="app" style="display:none"><button onclick="tab('o')">الطلبات</button><button onclick="tab('p')">المنتجات</button><button onclick="tab('s')">صور الموقع</button><div id="o"></div><div id="s" style="display:none"></div>
    <div id="p" style="display:none"><div class="c"><b>إضافة منتج</b><br><select id="ct"></select><input id="br" placeholder="البراند"><input id="nm" placeholder="اسم المنتج"><input id="pr" type="number" placeholder="السعر (فاضي = DM)"><input id="im" type="file" accept="image/*"><button onclick="addP()">إضافة</button></div><div id="pl"></div></div></div></div>
    <script src="config.js"></script><script>
    let T="";const $=i=>document.getElementById(i),e=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const S={new:"جديد",payment_review:"مراجعة الدفع",payment_confirmed:"تم تأكيد الدفع",preparing:"جاري التجهيز",shipped:"تم الشحن",delivered:"تم التسليم",cancelled:"ملغي"};
    const H=()=>{const h={apikey:SB_KEY,"Content-Type":"application/json"};if(T)h.Authorization="Bearer "+T;else if(SB_KEY.indexOf("eyJ")==0)h.Authorization="Bearer "+SB_KEY;return h};
    const rq=async(p,m,b,x)=>{const r=await fetch(SB_URL+"/rest/v1/"+p,{method:m||"GET",headers:Object.assign(H(),x||{}),body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d&&d.message||"خطأ");return d};
    async function login(){const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em.value,password:pw.value})});const d=await r.json();if(!d.access_token)return alert("بيانات غلط");T=d.access_token;lg.style.display="none";app.style.display="block";ct.innerHTML=(await rq("categories?order=sort")).map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join("");orders();prods();site()}
    function tab(x){["o","p","s"].forEach(k=>$(k).style.display=k==x?"block":"none")}
    async function orders(){const L=await rq("orders?order=created_at.desc");$("o").innerHTML=L.map(o=>`<div class="c"><b>${o.order_no}</b> — ${e(o.name)} — <a href="https://wa.me/2${o.phone}" target="_blank">${o.phone}</a>${o.alt_phone?" / "+e(o.alt_phone):""}<br>${e(o.governorate)} - ${e(o.city)}<br>${o.items.map(i=>e(i.name)+" ×"+i.qty+" ("+(i.price==null?"DM":i.price)+")").join("<br>")}<br>المنتجات: <b>${o.subtotal}</b> | الدفع: <b>${o.payment_method=="cod"?"عند الاستلام":"InstaPay "+(o.payment_confirmed?"✅ وصل":"⏳")}</b><br>
    ${o.receipt_path?`<button onclick="rc('${o.receipt_path}')">عرض الإيصال</button>`:""}${o.payment_method=="instapay"&&!o.payment_confirmed?`<button onclick="upd('${o.id}',{payment_confirmed:true,status:'payment_confirmed'})">تأكيد وصول المبلغ</button>`:""}<br>
    <select id="s${o.id}">${Object.keys(S).map(k=>`<option value="${k}" ${k==o.status?"selected":""}>${S[k]}</option>`).join("")}</select><input id="f${o.id}" type="number" placeholder="الشحن" value="${o.shipping_fee??""}"><input id="n${o.id}" placeholder="ملاحظة للزبون" value="${e(o.status_note||"")}"><button onclick="sv('${o.id}')">حفظ</button><br><small>رابط التتبع: track.html?o=${o.order_no}&t=${o.token}</small></div>`).join("")||"مفيش طلبات"}
    async function upd(id,b){try{await rq("orders?id=eq."+id,"PATCH",b,{Prefer:"return=minimal"});orders()}catch(x){alert(x.message)}}
    const sv=id=>upd(id,{status:$("s"+id).value,status_note:$("n"+id).value||null,shipping_fee:$("f"+id).value===""?null:+$("f"+id).value});
    async function rc(p){const r=await fetch(SB_URL+"/storage/v1/object/sign/receipts/"+p,{method:"POST",headers:H(),body:JSON.stringify({expiresIn:300})});const d=await r.json();window.open(SB_URL+"/storage/v1"+d.signedURL)}
    async function addP(){try{const f=im.files[0];if(!f)return alert("اختر صورة للمنتج");if(f.size>3e6)return alert("الصورة أكبر من 3MB");const fn=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+(f.type.split("/")[1]||"jpg").replace("jpeg","jpg");const u=await fetch(SB_URL+"/storage/v1/object/products/"+fn,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+T,"Content-Type":f.type},body:f});if(!u.ok)throw new Error("فشل رفع الصورة");const img=SB_URL+"/storage/v1/object/public/products/"+fn;let b=await rq("brands?category_id=eq."+ct.value+"&name=eq."+encodeURIComponent(br.value.trim()));if(!b.length)b=await rq("brands","POST",{category_id:+ct.value,name:br.value.trim()},{Prefer:"return=representation"});await rq("products","POST",{brand_id:b[0].id,name:nm.value.trim(),price:pr.value===""?null:+pr.value,image:img},{Prefer:"return=minimal"});nm.value=pr.value=im.value="";prods()}catch(x){alert(x.message)}}
    async function up(f){if(!f)throw new Error("اختر صورة");if(f.size>3e6)throw new Error("الصورة أكبر من 3MB");const fn="site-"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+(f.type.split("/")[1]||"jpg").replace("jpeg","jpg");const u=await fetch(SB_URL+"/storage/v1/object/products/"+fn,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+T,"Content-Type":f.type},body:f});if(!u.ok)throw new Error("فشل رفع الصورة");return SB_URL+"/storage/v1/object/public/products/"+fn}
    async function site(){const C=await rq("categories?order=sort");$("s").innerHTML=C.map(c=>`<div class="c"><b>${e(c.name)}</b> ${c.image?`<img src="${e(c.image)}" height="50">`:""}<input type="file" accept="image/*" id="ci${c.id}"><button onclick="setC(${c.id})">رفع</button></div>`).join("")+`<div class="c"><b>خلفية الموقع كله</b><input type="file" accept="image/*" id="hi"><button onclick="setH()">رفع</button></div>`}
    async function setC(id){try{const u=await up($("ci"+id).files[0]);await rq("categories?id=eq."+id,"PATCH",{image:u},{Prefer:"return=minimal"});site()}catch(x){alert(x.message)}}
    async function setH(){try{const u=await up($("hi").files[0]);await rq("site_settings","POST",{key:"hero",value:u},{Prefer:"resolution=merge-duplicates,return=minimal"});alert("تم")}catch(x){alert(x.message)}}
    async function prods(){const L=await rq("products?select=id,name,price,active,brands(name,categories(name))&order=id.desc&limit=200");$("pl").innerHTML=L.map(p=>`<div class="c">${e(p.brands.categories.name)} / ${e(p.brands.name)} / <b>${e(p.name)}</b> — ${p.price??"DM"} <button onclick="tg(${p.id},${!p.active})">${p.active?"إخفاء":"إظهار"}</button><button onclick="dl(${p.id})">حذف</button></div>`).join("")}
    const tg=async(i,a)=>{await rq("products?id=eq."+i,"PATCH",{active:a},{Prefer:"return=minimal"});prods()},dl=async i=>{if(confirm("حذف؟")){await rq("products?id=eq."+i,"DELETE",null,{Prefer:"return=minimal"});prods()}};
    </script></body></html>

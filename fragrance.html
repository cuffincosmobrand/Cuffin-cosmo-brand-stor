<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragrance | Cuffin Cosmo Brands</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
<div class="header-container">
<a href="index.html" class="logo">
<h1>Cuffin</h1>
<span>Cosmo Brands</span>
</a>
<nav class="nav">
<a href="index.html">Home</a>
<a href="index.html#categories">Categories</a>
<a href="index.html#about">About Us</a>
<a href="index.html#contact">Contact</a>
</nav>
<div class="header-actions">
<button id="language-button">AR</button>
<button id="cart-button">🛒<span id="cart-count">0</span></button>
</div>
</div>
</header>
<main>
<section class="products-section">
<div class="products-header">
<div class="products-title">
<h2>Fragrance</h2>
<p>Explore our Fragrance collection.</p>
</div>
<a href="index.html" class="back-button">← Back to Home</a>
</div>
<div id="products-container" data-category="Fragrance">
<p class="loading-text">Loading products...</p>
</div>
</section>
</main>
<!-- =========================
CART MODAL
========================= -->
<div id="cart-modal">
<div class="cart-content">
<div class="cart-header">
<h2>Your Cart</h2>
<button id="close-cart">×</button>
</div>
<div id="cart-items"></div>
<div id="cart-total">Total: 0 EGP</div>
<div class="cart-actions">
<button id="start-order-button" class="order-button whatsapp">
إتمام الطلب
</button>
</div>
</div>
</div>
<!-- =========================
REFERRAL MODAL
========================= -->
<div id="referral-modal">
<div class="referral-content">
<button id="close-referral">×</button>

<div id="referral-step-1">
<h3>هل طلبك من خلال مسوق؟</h3>
<button id="referral-yes" class="referral-option-btn">
من خلال مسوق
</button>
<button id="referral-no" class="referral-option-btn">
من دون مسوق
</button>
</div>

<div id="referral-step-2" style="display:none;">
<h3>اختر كود المسوق</h3>
<button class="referral-code-btn" data-code="CCB100">
CCB100
</button>
<button class="referral-code-btn" data-code="CCB101">
CCB101
</button>
<button class="referral-code-btn" data-code="CCB103">
CCB103
</button>
<button class="referral-code-btn" data-code="CCB104">
CCB104
</button>
</div>

<div id="referral-step-3" style="display:none;">
<h3>بيانات التوصيل</h3>
<div class="form-group">
<label for="customer-name">الاسم بالكامل</label>
<input type="text" id="customer-name" placeholder="اكتب اسمك بالكامل">
</div>
<div class="form-group">
<label for="customer-phone">رقم الهاتف</label>
<input type="tel" id="customer-phone" placeholder="01xxxxxxxxx">
</div>
<div class="form-checkbox">
<input type="checkbox" id="customer-whatsapp">
<label for="customer-whatsapp">هذا الرقم عليه واتساب</label>
</div>
<div class="form-group">
<label for="customer-alt-phone">رقم هاتف بديل (اختياري)</label>
<input type="tel" id="customer-alt-phone" placeholder="01xxxxxxxxx">
</div>
<div class="form-group">
<label for="customer-governorate">المحافظة</label>
<select id="customer-governorate">
<option value="">اختر المحافظة</option>
</select>
</div>
<div class="form-group">
<label for="customer-city">المركز / المدينة</label>
<input type="text" id="customer-city" placeholder="اكتب اسم المركز أو المدينة">
</div>
<p id="delivery-note" class="delivery-note"></p>
<button id="submit-order-button" class="order-button whatsapp">
إرسال الطلب
</button>
</div>

<div id="referral-step-4" style="display:none;">
<h3>تم إرسال طلبك بنجاح ✅</h3>
<p class="success-text">
هنتواصل معاك في أقرب وقت لتأكيد الطلب.
</p>
<button id="close-after-success" class="referral-option-btn">
إغلاق
</button>
</div>

</div>
</div>
<script src="script.js"></script>
</body>
</html>
